<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sort the sky</title>
<style>html,body{margin:0;background:#0d1b3a;overflow:hidden}</style></head>
<body>
<script src="phaser.js"></script>
<script src="gsap.js"></script>
<script src="kite-kit.js"></script>
<script>
const ROUNDS = [true, false, true, true, false];
let round = 0, right = 0, done = false;

class Play extends Phaser.Scene {
  preload() {
    this.load.image("sun", kite.svg('<circle cx="32" cy="32" r="22" fill="#ffd54f"/>', 96));
    this.load.image("dot", kite.svg('<circle cx="32" cy="32" r="30" fill="#fff"/>', 16));
  }
  create() {
    this.title = this.add.text(kite.W / 2, 80, kite.say("Is it daytime?"), { fontSize: "48px", color: "#fff" }).setOrigin(0.5);
    this.sun = this.add.image(kite.W / 2, kite.H / 2, "sun");
    this.burst = this.add.particles(0, 0, "dot", { speed: 200, lifespan: 600, scale: { start: 0.8, end: 0 }, emitting: false });
    this.input.keyboard.on("keydown-RIGHT", () => this.answer(ROUNDS[round]));
    this.input.keyboard.on("keydown-LEFT", () => this.answer(!ROUNDS[round]));
    this.input.on("pointerdown", () => this.answer(ROUNDS[round]));
    this.tweens.add({ targets: this.sun, angle: 360, duration: 4000, repeat: -1 });
    kite.ready();
  }
  answer(yes) {
    if (done) return;
    const ok = yes === ROUNDS[round];
    round++;
    if (ok) { right++; kite.sound("correct"); this.burst.explode(24, this.sun.x, this.sun.y); }
    else { kite.sound("oops"); this.cameras.main.shake(150, 0.004); }
    gsap.fromTo(this.sun, { scale: 1.3 }, { scale: 1, duration: 0.4, ease: "back.out(2)" });
    if (round === ROUNDS.length) { done = true; this.title.setText(kite.say("You finished!")); kite.sound("cheer"); kite.finish({ correct: right, total: round }); }
  }
}

const game = new Phaser.Game(kite.phaser({ backgroundColor: "#0d1b3a", scene: Play }));
window.kiteTest = { solve() { const s = game.scene.getScene("default"); while (!done) s.answer(ROUNDS[round]); } };
</script>
</body>
</html>
