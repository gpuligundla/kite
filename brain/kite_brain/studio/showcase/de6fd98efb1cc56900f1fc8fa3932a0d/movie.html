<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Rexy Sees a Blue Sky</title>
<style>
  html,body{margin:0;background:#05070d;height:100%;overflow:hidden}
  #stage{position:absolute;width:1280px;height:720px;overflow:hidden;background:#070b16;
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;color:#e6edf7}
  .scene{position:absolute;left:0;top:0;width:1280px;height:720px;visibility:hidden;opacity:0}
  .scene svg{position:absolute;left:0;top:0;width:1280px;height:720px}
  svg text{font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
  .lbl{fill:#dfe9f5;font-size:22px;letter-spacing:.5px}
  .lbl.sm{font-size:18px;fill:#9fb3c8}
  .lbl.acc{fill:#7fd3ff}
  .lbl.big{font-size:44px;font-weight:300}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 55%,#12233f 0%,#070b16 70%);z-index:20}
  #title h1{margin:0;font-weight:300;font-size:64px;letter-spacing:1px}
  #title h1 span{display:inline-block;opacity:0}
  #title .sub{margin-top:18px;font-size:20px;letter-spacing:6px;text-transform:uppercase;color:#7fd3ff;opacity:0}
  #title .rule{width:0;height:1px;background:#7fd3ff;margin-top:22px}
  #caps{position:absolute;left:40px;right:40px;bottom:16px;height:120px;z-index:10;opacity:0;visibility:hidden;
    background:rgba(7,11,20,.82);border:1px solid rgba(127,211,255,.22);border-radius:14px}
  .cap{position:absolute;left:0;top:0;right:0;padding:14px 28px;font-size:36px;line-height:46px;visibility:hidden;opacity:0}
  .cap span{display:inline-block;opacity:0;color:#e6edf7;margin-right:.26em}
  .tag{position:absolute;left:22px;top:-36px;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:#7fd3ff;
    background:rgba(7,11,20,.85);padding:5px 12px;border-radius:8px;border:1px solid rgba(127,211,255,.25);visibility:hidden;opacity:0}
  #guide{position:absolute;left:1108px;top:420px;width:150px;height:160px;z-index:12;opacity:0;visibility:hidden}
  #outro{position:absolute;inset:0;z-index:15;visibility:hidden;opacity:0;
    background:radial-gradient(ellipse at 50% 40%,#13284a 0%,#070b16 75%)}
  #outro .kick{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:18px;letter-spacing:6px;color:#7fd3ff;text-transform:uppercase}
  #outro .q{position:absolute;left:150px;width:900px;top:160px;text-align:center;font-size:36px;line-height:46px;font-weight:300}
  #outro .grid{position:absolute;left:150px;width:900px;top:320px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  #outro .ch{border:1px solid rgba(127,211,255,.35);border-radius:12px;padding:16px 20px;font-size:24px;line-height:30px;background:rgba(10,18,34,.7)}
  #outro .ch b{color:#7fd3ff;font-weight:600;margin-right:10px}
  #wipe{position:absolute;top:0;left:-20px;width:3px;height:720px;background:#7fd3ff;z-index:14;opacity:0;box-shadow:0 0 18px #7fd3ff}
</style>
</head>
<body>
<div id="stage">

  <!-- SCENE 0 : the question -->
  <div class="scene" id="s0"><svg viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b2142"/><stop offset=".6" stop-color="#2a66a8"/><stop offset="1" stop-color="#78b0e0"/>
      </linearGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#fff3cf" stop-opacity=".9"/><stop offset=".35" stop-color="#ffe2a0" stop-opacity=".35"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
      <linearGradient id="gSet" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1238"/><stop offset=".45" stop-color="#6a2b5a"/><stop offset=".78" stop-color="#e0623a"/><stop offset="1" stop-color="#ffb760"/>
      </linearGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#gSky)"/>
    <g id="s0sun"><circle cx="960" cy="150" r="150" fill="url(#gGlow)"/><circle cx="960" cy="150" r="44" fill="#fff4d8"/></g>
    <g id="s0rays" stroke="#fff4d8" stroke-width="2" stroke-linecap="round" opacity=".9"></g>
    <path id="s0far" d="M0,470 L120,420 L240,455 L380,400 L520,450 L660,410 L820,460 L980,415 L1120,450 L1280,420 L1280,720 L0,720Z" fill="#1f4f80"/>
    <path id="s0mid" d="M0,520 L160,480 L300,515 L470,470 L640,520 L800,488 L960,525 L1120,490 L1280,515 L1280,720 L0,720Z" fill="#14375c"/>
    <path id="s0fg" d="M0,580 Q300,540 620,575 T1280,560 L1280,720 L0,720Z" fill="#0a1a2e"/>
    <text class="lbl big" x="110" y="118" id="s0q">Why blue?</text>
    <g id="s0sw">
      <g><circle cx="170" cy="210" r="40" fill="#f4f6fa" stroke="#dfe9f5" stroke-width="1.5"/><text class="lbl" x="170" y="290" text-anchor="middle">white?</text></g>
      <g><circle cx="320" cy="210" r="40" fill="#5fbf7a" stroke="#dfe9f5" stroke-width="1.5"/><text class="lbl" x="320" y="290" text-anchor="middle">green?</text></g>
      <g><circle cx="470" cy="210" r="40" fill="#3f8ee8" stroke="#dfe9f5" stroke-width="1.5"/><text class="lbl acc" x="470" y="290" text-anchor="middle">blue</text>
        <circle id="s0ring" cx="470" cy="210" r="52" fill="none" stroke="#7fd3ff" stroke-width="2"/></g>
    </g>
    <text class="lbl acc" x="700" y="330" id="s0lbl">sunlight</text>
  </svg></div>

  <!-- SCENE 1 : white light is all colors; wavelengths -->
  <div class="scene" id="s1"><svg viewBox="0 0 1280 720">
    <defs><clipPath id="cWave"><rect x="1080" y="100" width="700" height="360"/></clipPath></defs>
    <rect width="1280" height="720" fill="#08101f"/>
    <g id="s1grid" stroke="#13223a" stroke-width="1"></g>
    <g id="s1world">
      <circle cx="140" cy="320" r="120" fill="url(#gGlow)"/><circle cx="140" cy="320" r="42" fill="#fff4d8"/>
      <path id="s1beam" d="M185,320 L468,300" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <path id="s1prism" d="M520,190 L625,405 L415,405 Z" fill="rgba(160,210,255,.12)" stroke="#bfe6ff" stroke-width="1.6"/>
      <g id="s1fan" stroke-width="5" stroke-linecap="round"></g>
      <text class="lbl" x="230" y="282" id="s1l1">white light</text>
      <text class="lbl acc" x="930" y="420" id="s1l2">all colors mixed</text>
      <g clip-path="url(#cWave)">
        <path id="s1red" fill="none" stroke="#ff6b5a" stroke-width="3"/>
        <path id="s1blue" fill="none" stroke="#4cb8ff" stroke-width="3"/>
      </g>
      <text class="lbl" x="1060" y="208" text-anchor="end" fill="#ff8a7a" id="s1tr" style="fill:#ff8a7a">red</text>
      <text class="lbl" x="1060" y="368" text-anchor="end" id="s1tb" style="fill:#7fd3ff">blue</text>
      <g id="s1brR" stroke="#ff8a7a" stroke-width="1.4" fill="none"><path d="M1130,128 L1130,118 L1330,118 L1330,128"/></g>
      <text class="lbl sm" x="1230" y="106" text-anchor="middle" id="s1lr">λ ≈ 700 nm</text>
      <g id="s1brB" stroke="#7fd3ff" stroke-width="1.4" fill="none"><path d="M1102,290 L1102,280 L1222,280 L1222,290"/></g>
      <text class="lbl sm" x="1162" y="268" text-anchor="middle" id="s1lb">λ ≈ 450 nm</text>
    </g>
  </svg></div>

  <!-- SCENE 2 : into the atmosphere -->
  <div class="scene" id="s2"><svg viewBox="0 0 1280 720">
    <rect width="1280" height="720" fill="#050914"/>
    <g id="s2wide">
      <g id="s2stars" fill="#cfe3ff"></g>
      <circle cx="640" cy="1960" r="1520" fill="#2f74c4" opacity=".35"/>
      <circle cx="640" cy="1960" r="1490" fill="#3b86d6" opacity=".35"/>
      <circle cx="640" cy="1960" r="1460" fill="#0e2a4a"/>
      <path d="M0,640 Q640,470 1280,640" fill="none" stroke="#7fd3ff" stroke-width="1" opacity=".6"/>
      <g id="s2dots" fill="#bfe6ff"></g>
      <path id="s2beam" d="M140,40 L700,476" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text class="lbl acc" x="880" y="430" id="s2l0">atmosphere</text>
    </g>
    <g id="s2close">
      <rect width="1280" height="720" fill="#0c2240"/>
      <g id="s2mols"></g>
      <path id="s2wave" fill="none" stroke="#4cb8ff" stroke-width="3"/>
      <g id="s2br" stroke="#7fd3ff" stroke-width="1.4" fill="none"><path d="M380,190 L380,178 L700,178 L700,190"/></g>
      <text class="lbl sm" x="540" y="166" text-anchor="middle" id="s2lw">one wavelength ≈ 450 nm</text>
      <g id="s2arrows"></g>
      <circle id="s2ring" cx="640" cy="360" r="20" fill="none" stroke="#7fd3ff" stroke-width="2"/>
      <text class="lbl" x="110" y="560" id="s2ln">N₂ · O₂  ≈ 0.3 nm</text>
      <text class="lbl acc" x="640" y="80" text-anchor="middle" id="s2ls">scattered every way</text>
    </g>
  </svg></div>

  <!-- SCENE 3 : Rayleigh scattering -->
  <div class="scene" id="s3"><svg viewBox="0 0 1280 720">
    <rect width="1280" height="720" fill="#08101f"/>
    <g id="s3a">
      <path id="s3inB" fill="none" stroke="#4cb8ff" stroke-width="3"/>
      <path id="s3inR" fill="none" stroke="#ff6b5a" stroke-width="3"/>
      <path id="s3outR" fill="none" stroke="#ff6b5a" stroke-width="3"/>
      <g id="s3arrB"></g>
      <g id="s3mol"><circle cx="505" cy="330" r="13" fill="#bfe6ff"/><circle cx="527" cy="330" r="13" fill="#9fd0f5"/></g>
      <text class="lbl" x="516" y="560" text-anchor="middle">air molecule</text>
      <g id="s3chart">
        <line x1="840" y1="250" x2="1030" y2="250" stroke="#5a6f88" stroke-width="1.2"/>
        <rect id="s3barB" x="862" y="90" width="56" height="160" fill="#4cb8ff"/>
        <rect id="s3barR" x="952" y="223" width="56" height="27" fill="#ff6b5a"/>
        <text class="lbl sm" x="890" y="274" text-anchor="middle">450 nm</text>
        <text class="lbl sm" x="980" y="274" text-anchor="middle">700 nm</text>
        <text class="lbl acc" x="935" y="70" text-anchor="middle">I ∝ 1/λ⁴</text>
        <text class="lbl" x="1000" y="205" text-anchor="middle">≈ 6×</text>
      </g>
      <text class="lbl" x="1060" y="398" text-anchor="end" style="fill:#ff8a7a" id="s3lr">red: straight on</text>
    </g>
    <g id="s3b">
      <rect width="1280" height="720" fill="#0b1c35"/>
      <path d="M140,540 A420,420 0 0 1 980,540 Z" fill="#1f5a9c" opacity=".45"/>
      <path id="s3dome" d="M140,540 A420,420 0 0 1 980,540" fill="none" stroke="#7fd3ff" stroke-width="1.4"/>
      <circle cx="1060" cy="120" r="80" fill="url(#gGlow)"/><circle cx="1060" cy="120" r="28" fill="#fff4d8"/>
      <path id="s3sunray" d="M1035,140 L700,330" stroke="#fff4d8" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <rect x="0" y="540" width="1280" height="180" fill="#081322"/>
      <g id="s3dmols"></g>
      <g id="s3rays"></g>
      <g transform="translate(538,500)"><g id="s3rex"><path d="M0,40 L6,18 Q4,4 16,0 Q30,-2 34,8 L26,12 L20,10 L22,26 L30,40 Z" fill="#0f2238" stroke="#7fd3ff" stroke-width="1.4"/><circle cx="24" cy="6" r="2" fill="#7fd3ff"/></g></g>
      <text class="lbl acc" x="560" y="80" text-anchor="middle" id="s3lb">blue from every direction</text>
    </g>
  </svg></div>

  <!-- SCENE 4 : sunset path -->
  <div class="scene" id="s4"><svg viewBox="0 0 1280 720">
    <rect width="1280" height="720" fill="#070d1a"/>
    <g id="s4a"><g id="s4world">
      <circle cx="560" cy="1100" r="750" fill="#1f5a9c" opacity=".35"/>
      <circle cx="560" cy="1100" r="750" fill="none" stroke="#7fd3ff" stroke-width="1" opacity=".6"/>
      <circle cx="560" cy="1100" r="640" fill="#0e2440" stroke="#5a7ea8" stroke-width="1.2"/>
      <circle cx="560" cy="250" r="22" fill="#fff4d8"/>
      <path id="s4noon" d="M560,280 L560,456" stroke="#fff4d8" stroke-width="3" stroke-linecap="round"/>
      <text class="lbl" x="580" y="330" id="s4ln">noon: short path</text>
      <circle cx="1040" cy="460" r="60" fill="url(#gGlow)"/><circle cx="1040" cy="460" r="24" fill="#ffb760"/>
      <path id="s4set" d="M1010,460 L566,460" stroke="#ffd2a0" stroke-width="3" stroke-linecap="round"/>
      <path id="s4setR" d="M1010,460 L566,460" stroke="#ff6b5a" stroke-width="4" stroke-linecap="round"/>
      <g id="s4peel"></g>
      <circle cx="560" cy="460" r="6" fill="#7fd3ff"/>
      <text class="lbl" x="740" y="500" id="s4ls" style="fill:#ffb08a">sunset: long path</text>
      <text class="lbl acc" x="700" y="230" id="s4lb">blue scattered out</text>
    </g></g>
    <g id="s4b">
      <rect width="1280" height="720" fill="url(#gSet)"/>
      <g transform="translate(0,-80)"><g id="s4bsun"><circle cx="820" cy="520" r="190" fill="url(#gGlow)"/><circle cx="820" cy="520" r="64" fill="#ffcf8a"/></g>
      <path id="s4far" d="M-100,540 L80,500 L260,530 L460,488 L660,535 L860,500 L1060,540 L1260,505 L1400,530 L1400,720 L-100,720Z" fill="#5a2a4f"/>
      <path id="s4mid" d="M-100,580 L140,545 L380,575 L620,540 L860,580 L1100,550 L1400,575 L1400,820 L-100,820Z" fill="#33183a"/>
      <path id="s4fg" d="M-100,640 Q300,590 640,625 T1400,610 L1400,820 L-100,820Z" fill="#160b1e"/>
      <g transform="translate(380,560)"><g id="s4rex"><path d="M0,44 L8,20 Q6,4 20,0 Q36,-2 40,10 L30,14 L24,12 L26,30 L34,44 Z" fill="#120816" stroke="#ffb08a" stroke-width="1.4"/><circle cx="30" cy="7" r="2" fill="#ffb08a"/></g></g>
      <path id="s4ray" d="M760,515 L418,568" stroke="#ff8a5a" stroke-width="3" stroke-linecap="round"/><g id="s4bpeel"></g></g>
      <text class="lbl" x="110" y="120" id="s4lred" style="fill:#ffe0c0">red light remains</text>
      <text class="lbl acc" x="520" y="400" id="s4lgone">blue scattered away</text>
    </g>
  </svg></div>

  <div id="wipe"></div>

  <!-- GUIDE : Rexy -->
  <div id="guide"><svg viewBox="0 0 150 160" width="150" height="160">
    <g id="gBody">
      <path d="M96,96 Q136,100 148,66 Q132,96 94,114 Z" fill="#132338" stroke="#7fd3ff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M84,122 L80,152 L66,154 L68,158 L92,158 L96,124 Z" fill="#132338" stroke="#7fd3ff" stroke-width="1.6" stroke-linejoin="round"/>
      <ellipse cx="86" cy="104" rx="30" ry="26" fill="#132338" stroke="#7fd3ff" stroke-width="1.6"/>
      <path d="M78,96 Q86,110 100,112" fill="none" stroke="#2c4d70" stroke-width="1.2"/>
      <g id="gArm"><path d="M64,100 L48,106 L44,102" fill="none" stroke="#7fd3ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="gHead">
        <path d="M74,88 Q70,48 40,44 Q12,42 8,58 Q6,72 28,76 Q46,78 58,92 Z" fill="#132338" stroke="#7fd3ff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12,66 Q28,70 42,66" fill="none" stroke="#7fd3ff" stroke-width="1.2" stroke-linecap="round"/>
        <g id="gEye"><circle cx="38" cy="55" r="4.2" fill="#7fd3ff"/><circle cx="37" cy="54" r="1.4" fill="#fff"/></g>
      </g>
    </g>
  </svg></div>

  <div id="caps"></div>

  <div id="outro">
    <div class="kick">Check your thinking</div>
    <div class="q" id="oq"></div>
    <div class="grid" id="ogrid"></div>
  </div>

  <div id="title"><h1 id="th"></h1><div class="rule" id="trule"></div><div class="sub" id="tsub">Rayleigh scattering</div></div>
</div>

  return {g,p,head};
}

/* ---------- captions ---------- */
const caps=$('caps');
tl.fromTo(caps,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:0.6,ease:'expo.out'},M.lines[0].start-0.3);
tl.to(caps,{autoAlpha:0,y:20,duration:0.4,ease:'power2.in'},M.outro.start-0.1);

  const cap=document.createElement('div'); cap.className='cap'; caps.appendChild(cap);
